name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev --python '${{ matrix.python }}'
      - run: uv run --no-sync python -m pytest tests/ -q
      - run: uv run --no-sync python -m build
      - run: uv run --no-sync sap-cua doctor
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/api.Dockerfile -t sap-cua:ci .
      - run: |
          docker run -d --name sap-cua-ci -p 127.0.0.1:8000:8000 sap-cua:ci
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs sap-cua-ci
          exit 1
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sap_cua
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: sapcua_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sap_cua -d sapcua_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev --python '3.12'
      - run: uv run --no-sync pytest tests/test_rag_postgres.py -q
        env:
          SAP_CUA_TEST_DATABASE_URL: postgresql://sap_cua:ci_fixture_only@localhost:5432/sapcua_test
