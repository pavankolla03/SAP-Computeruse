[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-cua"
version = "0.3.0"
description = "SAP Integration Suite agent research workbench"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.27,<1", "pydantic>=2.5,<3",
  "pydantic-settings>=2.1,<3", "pillow>=10.2", "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4", "fastembed==0.9.0", "opentelemetry-sdk>=1.30,<2", "defusedxml>=0.7,<1",
  "python-dotenv>=1,<2", "pyyaml>=6,<7", "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=5", "ruff>=0.11", "build>=1"]
ml = ["torch>=2.6,<3", "transformers==4.53.3", "accelerate>=1.9,<2", "peft>=0.17,<0.18", "huggingface-hub>=0.34,<1", "safetensors>=0.5", "tiktoken>=0.9", "blobfile>=3"]
browser = ["playwright>=1.55,<2"]
qlora = ["bitsandbytes>=0.46; sys_platform == 'linux'"]

[project.scripts]
sap-cua = "sap_cua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sap_cua = ["web/*.html", "web/*.css", "web/*.js", "rag/*.jsonl", "engineering/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
