services:
  workbench:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sap-cua-data:/data
    environment:
      SAP_CUA_DATA_DIR: /data
      SAP_CUA_ALLOW_CONTAINER: "1"
    restart: unless-stopped
volumes:
  sap-cua-data:
